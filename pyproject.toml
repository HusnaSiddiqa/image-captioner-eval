[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "captioner"
version = "0.1.0"
description = "Simple image captioning app using pre-trained BLIP"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "transformers>=4.40", "pillow>=10.0"]

[project.optional-dependencies]
demo = ["gradio>=4.0"]
train = ["peft>=0.10", "datasets>=2.18", "accelerate>=0.29"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
